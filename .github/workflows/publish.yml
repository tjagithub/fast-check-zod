name: publish

# Publishes when a push to main carries a package.json version that npm doesn't have yet,
# then tags the commit. npm trusted publishing (OIDC) authenticates, so no token is stored.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the version to release
        id: version
        run: |
          version=$(jq -r .version package.json)
          name=$(jq -r .name package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true # nothing restored from a cache goes into a published package

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Check
        if: steps.version.outputs.publish == 'true'
        run: |
          bun install --frozen-lockfile
          bun check
          bun test
          bun run coverage
          bun run coverage:branches
          FUZZ_RUNS=5000 bun test tests/fuzz.test.ts

      # Trusted publishing needs npm 11.5.1 or later. prepublishOnly runs the build.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "npm $(npm --version) is too old for trusted publishing"; exit 1; }
          npm publish

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
