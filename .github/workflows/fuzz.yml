name: Fuzz

# The lockfile pins zod and fast-check, so a long run only finds something new when code or dependencies change.
on:
  push:
    branches: [main]
    paths: [src/**, tests/support/**, tests/fuzz.test.ts, package.json, bun.lock]
  pull_request:
    paths: [src/**, tests/support/**, tests/fuzz.test.ts, package.json, bun.lock]
  workflow_dispatch:
    inputs:
      runs:
        description: Number of random schemas
        default: "20000"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # A failure prints the shrunk schema as z.… code and the seed to replay it.
      - run: bun test tests/fuzz.test.ts
        env:
          FUZZ_RUNS: ${{ inputs.runs || '20000' }}
